table_id: psi117_kavg_cool_mst
psi_id: PSI-117
grain: published_point
title: n-Dodecane average cool-flame burning rate versus pressure (Microgravity Sci. Technol. 2024, Fig. 4)
source:
  file: files/PSI-117/Analyzed Data/PSI-117_Analyzed Data_MST_2024_Kavg.csv
  usecols:
  - 1
  - 2
constants:
  fuel_phase: liquid
  geometry: droplet
  oxidizer_location: ambient
  o2_mole_frac: 0.21
  n2_mole_frac: 0.79
  fuel_raw: n-dodecane
  char_diameter_mm: 4.5
label:
- Pressure
- Kavg_CF
keep_if:
- column: Kavg_CF
  regex: \d
  reason: empty row of the block
semantic_notes:
- Initial diameter 4.5 mm is the nominal value from the ReadMe, declared as a constant.
- Ground re-analysis of ISS droplet flights (FLEX, FLEX-2, CFI). Points digitised from the publication figures, stored as published_point in campaigns.parquet, never counted as tests.
- Oxygen 0.21 and nitrogen 0.79 are not in the file; they come from the investigation ReadMe (ReadMe_List_of_Data.xlsx) and are declared here as constants.
- 'Model / simulation columns of the same file are not loaded: only experimental points.'
- 'gravity_g is null: PSI-117 has no flightProgram in its metadata (ground investigation), although the droplets burned on the ISS.'
columns:
  Pressure:
    field: pressure_kpa
    parser: number
    unit: atm
  Kavg_CF:
    variable: burning_rate_constant_cool
    parser: number
    unit: mm2/s
