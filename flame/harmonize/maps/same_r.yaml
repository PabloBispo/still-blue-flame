  Description: {field: notes}
  Date: {field: campaign_day}
  Inlet velocity (cm/s): {field: flow_velocity_cm_s, parser: number, unit: cm/s}
  Rt/R0: {variable: heater_resistance_ratio, parser: number, unit: '1'}
  Duration (sec): {variable: smoke_duration, parser: number, unit: s}
  Primary aging time (sec): {variable: aging_time_primary, parser: number, unit: s}
  Primary mixing time (sec): {variable: mixing_time_primary, parser: number, unit: s}
  Net aging time (sec): {variable: aging_time_net, parser: number, unit: s}
