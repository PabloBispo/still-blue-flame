table_id: same_r
psi_id: PSI-101
grain: test
title: SAME-R, smoke aerosol from overheated spacecraft materials
source:
  file: files/PSI-101/Experimental table/PSI-101_Experimental table_SAME-R.csv
constants: {fuel_phase: solid, geometry: heated_sample, oxidizer_location: ambient}
label: ['SAME Test #']
semantic_notes:
  - Pyrolysis smoke, not flaming combustion. ignited and outcome do not apply and stay null.
  - "Dates are written without year ('21-Jul'); kept as text in campaign_day."
columns:
  Sample Type: {field: fuel_raw}
