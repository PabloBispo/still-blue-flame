table_id: cfig_inverse
psi_id: PSI-159
grain: test
title: ACME CFI-G, inverse flames (oxidizer issues from the spherical burner into a fuel ambient)
source:
  file: files/PSI-159/Experimental table/PSI-159_Experimental table_CFI-G_Inverse Flames.csv
constants: {fuel_phase: gas, geometry: spherical_burner, flame_type: inverse, oxidizer_location: burner_stream}
label: [Test]
semantic_notes:
  - XO2 is the oxygen fraction of the burner stream, not of the chamber. Do not compare with habitat atmospheres.
  - Xf is the fuel mole fraction of the ambient.
  - The file has 861 fully blank rows after the data; they are counted and discarded.
columns:
  Flame Type: {ignore: 'constant; see constants.flame_type'}
  Day: {field: campaign_day}
  Fuel: {field: fuel_raw}
  Test: {field: test_label}
  Xf before test: {field: fuel_mole_frac, parser: number, unit: mole_frac}
  Xf after test: {variable: fuel_mole_frac_final, parser: number, unit: mole_frac}
  approx p (bar): {field: pressure_kpa, parser: number, unit: bar}
  XO2: {field: o2_mole_frac, parser: number, unit: mole_frac}
  HC burnrate (mg/s): {variable: hc_fuel_mass_flow, parser: number, unit: mg/s}
  O2 flow rate (mg/s): {variable: o2_mass_flow, parser: number, unit: mg/s}
  TFP: {variable: tfp_used}
  Tad (K): {variable: adiabatic_flame_temp, parser: number, unit: K}
  Zst: {variable: stoich_mixture_fraction, parser: number, unit: '1'}
  Hot ignition:
    - {field: ignited, parser: enum, map: {'yes': true, 'no': false, 'flash': null}}
    - {variable: ignition_class}
  burn time (sec): {field: burn_time_s, parser: number, unit: s}
  Self -ext or flow term: {field: outcome, parser: enum, map: {SE: self_extinguished, FT: flow_terminated}}
  Peak burner Temp (C): {ignore: duplicate of the Kelvin column}
  Peak burner temp (K): {variable: peak_burner_temp, parser: number, unit: K}
  Color: {variable: flame_color}
  Comments: {field: notes}
