table_id: same
psi_id: PSI-102
grain: test
title: SAME, smoke aerosol measurement (first flight)
source:
  file: files/PSI-102/Experimental table/PSI-102_Experimental table_SAME.csv
constants: {fuel_phase: solid, geometry: heated_sample, oxidizer_location: ambient}
