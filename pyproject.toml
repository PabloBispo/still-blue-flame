[project]
name = "still-blue-flame"
version = "1.0.0"
description = "Flame in Freefall: unified microgravity combustion dataset and analysis (NASA Space Apps 2026, team Still Blue)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas>=2.0",
    "pyarrow>=15",
    "pyyaml",
    "openpyxl",
    "plotly>=5.20",
    "opencv-python-headless",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
